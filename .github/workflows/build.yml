name: Build Fabric mod
on:
  push:
    branches: ["feat/cryo-lance-animation"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build
        run: java -cp gradle/wrapper/gradle-wrapper.jar org.gradle.wrapper.GradleWrapperMain build --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: spacemod-cryo-alpha
          path: build/libs/*.jar
